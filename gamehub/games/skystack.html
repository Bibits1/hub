<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>SkyStack</title>
<meta name="description" content="Stack blocks as high as you can. Tap to drop, line them up perfectly." />
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #14182B; overflow: hidden; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #F1E9D8;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    touch-action: manipulation;
  }
  .header { text-align: center; padding: 20px 16px 10px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.22em; color: #C9A24B; margin-bottom: 4px; }
  h1 { font-size: 32px; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
  .subtitle { color: #8B90AC; font-size: 12px; margin: 4px 0 0; }
  #wrap { position: relative; flex: 1; width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: center; }
  canvas { background: #191D33; border-radius: 18px; display: block; touch-action: manipulation; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  #scoreBadge {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; color: #F1E9D8;
    background: rgba(20,24,43,0.6); padding: 6px 16px; border-radius: 999px;
    letter-spacing: 0.04em;
  }
  #perfectFlash {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 700; color: #D9A441; opacity: 0; letter-spacing: 0.12em;
    pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
  }
  #perfectFlash.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .overlay {
    position: absolute; inset: 0; background: rgba(20,24,43,0.86);
    display: none; align-items: center; justify-content: center; border-radius: 18px;
  }
  .overlay.show { display: flex; }
  .overlayCard {
    background: #1B1F3B; border: 1px solid #2E3358; border-radius: 18px;
    padding: 26px 30px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
    max-width: 260px;
  }
  .overlayCard h2 { font-size: 22px; margin: 8px 0 0; }
  .overlayCard p { color: #8B90AC; font-size: 13px; margin: 0 0 10px; }
  .overlayBtn {
    font-weight: 600; font-size: 14px; color: #14182B; background: #C9A24B;
    border: none; border-radius: 10px; padding: 10px 22px; cursor: pointer; margin-top: 6px;
  }
  .hint { color: #8B90AC; font-size: 12px; text-align: center; padding: 10px 16px 20px; }
</style>
</head>
<body>
<a href="../index.html" style="position:fixed;top:14px;left:14px;z-index:999;background:rgba(0,0,0,0.35);color:#fff;text-decoration:none;font:600 12px -apple-system,sans-serif;padding:8px 14px;border-radius:999px;backdrop-filter:blur(4px);">&larr; Games</a>

<div class="header">
  <div class="eyebrow">BEST: <span id="bestLabel">0</span></div>
  <h1>SkyStack</h1>
  <p class="subtitle">tap to drop · line it up · don't miss</p>
</div>

<div id="wrap">
  <canvas id="game" width="340" height="560"></canvas>
  <div id="scoreBadge">0</div>
  <div id="perfectFlash">PERFECT!</div>

  <div class="overlay show" id="startOverlay">
    <div class="overlayCard">
      <span style="font-size:28px;">🗼</span>
      <h2>SkyStack</h2>
      <p>Tap anywhere to drop each block.<br/>Line it up with the one below —<br/>miss too much and it's over.</p>
      <button class="overlayBtn" id="startBtn">Start</button>
    </div>
  </div>

  <div class="overlay" id="overOverlay">
    <div class="overlayCard">
      <span style="font-size:28px;">🏆</span>
      <h2>Tower down!</h2>
      <p id="finalScore"></p>
      <button class="overlayBtn" id="retryBtn">Try again</button>
    </div>
  </div>
</div>

<p class="hint">tap the board · or press Space</p>

<script>
(function () {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var BLOCK_HEIGHT = 30;
  var TOP_MARGIN = 90;
  var BASE_MARGIN = 40;
  var STORAGE_KEY = "skystack-best";

  var COLORS = ["#E4572E","#D9A441","#3E8EDE","#6E8B6D","#C1443C","#8E6BAF","#3AA6A6","#E0A96D"];

  var state = "idle"; // idle | playing | over
  var blocks = [];    // placed blocks: {x, width, colorIndex}
  var moving = null;  // {x, width, dir, speed, colorIndex}
  var score = 0;
  var best = 0;
  var fallingPieces = [];
  var perfectTimeout = null;

  function loadBest() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      best = v ? parseInt(v, 10) || 0 : 0;
    } catch (e) { best = 0; }
    document.getElementById("bestLabel").textContent = best;
  }

  function saveBest() {
    try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (e) {}
  }

  function cameraScroll() {
    var visibleRows = Math.floor((H - TOP_MARGIN - BASE_MARGIN) / BLOCK_HEIGHT);
    var n = blocks.length;
    return n > visibleRows ? (n - visibleRows) * BLOCK_HEIGHT : 0;
  }

  function yForIndex(n) {
    var scroll = cameraScroll();
    return H - BASE_MARGIN - (n * BLOCK_HEIGHT) + scroll - BLOCK_HEIGHT;
  }

  function startGame() {
    blocks = [{ x: (W - 160) / 2, width: 160, colorIndex: 0 }];
    fallingPieces = [];
    score = 0;
    document.getElementById("scoreBadge").textContent = "0";
    spawnMoving();
    state = "playing";
    document.getElementById("startOverlay").classList.remove("show");
    document.getElementById("overOverlay").classList.remove("show");
  }

  function spawnMoving() {
    var last = blocks[blocks.length - 1];
    var fromLeft = blocks.length % 2 === 1;
    var speed = Math.min(2.2 + blocks.length * 0.09, 6.5);
    moving = {
      x: fromLeft ? -last.width : W,
      width: last.width,
      dir: fromLeft ? 1 : -1,
      speed: speed,
      colorIndex: blocks.length % COLORS.length,
    };
  }

  function drop() {
    if (state !== "playing" || !moving) return;
    var last = blocks[blocks.length - 1];
    var mLeft = moving.x, mRight = moving.x + moving.width;
    var lLeft = last.x, lRight = last.x + last.width;

    var overlapStart = Math.max(mLeft, lLeft);
    var overlapEnd = Math.min(mRight, lRight);
    var overlapWidth = overlapEnd - overlapStart;

    if (overlapWidth <= 4) {
      endGame();
      return;
    }

    var isPerfect = Math.abs(mLeft - lLeft) < 4;
    var newWidth = isPerfect ? last.width : overlapWidth;
    var newX = isPerfect ? last.x : overlapStart;

    // falling debris for the trimmed-off pieces
    if (!isPerfect) {
      if (mLeft < overlapStart) {
        fallingPieces.push({ x: mLeft, y: yForIndex(blocks.length), width: overlapStart - mLeft, colorIndex: moving.colorIndex, vy: 2, vx: -1.5 });
      }
      if (mRight > overlapEnd) {
        fallingPieces.push({ x: overlapEnd, y: yForIndex(blocks.length), width: mRight - overlapEnd, colorIndex: moving.colorIndex, vy: 2, vx: 1.5 });
      }
    }

    blocks.push({ x: newX, width: newWidth, colorIndex: moving.colorIndex });
    score++;
    document.getElementById("scoreBadge").textContent = String(score);

    if (isPerfect) {
      var flash = document.getElementById("perfectFlash");
      flash.classList.add("show");
      clearTimeout(perfectTimeout);
      perfectTimeout = setTimeout(function () { flash.classList.remove("show"); }, 500);
    }

    spawnMoving();
  }

  function endGame() {
    state = "over";
    if (score > best) {
      best = score;
      saveBest();
      document.getElementById("bestLabel").textContent = best;
    }
    document.getElementById("finalScore").textContent = "Height: " + score + (score >= best && score > 0 ? " · new best!" : " · best: " + best);
    document.getElementById("overOverlay").classList.add("show");
  }

  function update() {
    if (state === "playing" && moving) {
      moving.x += moving.dir * moving.speed;
      if (moving.x <= 0) { moving.x = 0; moving.dir = 1; }
      if (moving.x + moving.width >= W) { moving.x = W - moving.width; moving.dir = -1; }
    }
    fallingPieces.forEach(function (p) {
      p.vy += 0.4;
      p.y += p.vy;
      p.x += p.vx;
    });
    fallingPieces = fallingPieces.filter(function (p) { return p.y < H + 40; });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // placed blocks
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      var y = yForIndex(i);
      if (y > H || y < -BLOCK_HEIGHT) continue;
      ctx.fillStyle = COLORS[b.colorIndex % COLORS.length];
      roundRect(ctx, b.x, y, b.width, BLOCK_HEIGHT, 6);
      ctx.fill();
    }

    // falling debris
    fallingPieces.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, 1 - p.y / H);
      ctx.fillStyle = COLORS[p.colorIndex % COLORS.length];
      roundRect(ctx, p.x, p.y, p.width, BLOCK_HEIGHT, 6);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    // moving block
    if (state === "playing" && moving) {
      var my = yForIndex(blocks.length);
      ctx.fillStyle = COLORS[moving.colorIndex % COLORS.length];
      roundRect(ctx, moving.x, my, moving.width, BLOCK_HEIGHT, 6);
      ctx.fill();
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function handleTap() {
    if (state === "idle") return;
    if (state === "playing") drop();
  }

  canvas.addEventListener("pointerdown", handleTap);
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); handleTap(); }
  });
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  loadBest();
  draw();
  loop();
})();
</script>
</body>
</html>

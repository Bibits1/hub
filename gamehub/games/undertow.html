<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Undertow</title>
<meta name="description" content="Trace one continuous path through every cell, in ascending numeric order." />
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0B1F2E; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #E8E3D3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 16px 48px;
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.22em; color: #4FBDB4; margin-bottom: 6px; }
  h1 { font-size: 38px; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
  .subtitle { color: #7C93A0; font-size: 13px; margin: 4px 0 0; text-align: center; }
  .statsRow { display: flex; gap: 18px; font-size: 13px; color: #4FBDB4; margin: 16px 0 14px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 58px);
    grid-template-rows: repeat(5, 58px);
    gap: 7px;
    background: #0F2A3D;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    touch-action: none;
  }
  .cell {
    width: 58px; height: 58px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    background: #17384E;
    border: 2px solid transparent;
    transition: transform 100ms ease, background 150ms ease, border-color 150ms ease;
    user-select: none;
    position: relative;
    z-index: 2;
  }
  .cell:active { transform: scale(0.94); }
  .cell.clue { color: #D9A441; border-color: #D9A44155; }
  .cell.filled { background: #2FA6A0; color: #0B1F2E; }
  .cell.start { box-shadow: 0 0 0 2px #4FBDB4; }
  .cell.hinted { box-shadow: 0 0 0 3px #D9A441; }
  .cell.shake { animation: shake 300ms ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .cell.blank-dot::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #3D5C6C; }

  .controls { display: flex; gap: 12px; margin-top: 22px; }
  button.action {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: #E8E3D3;
    background: #17384E; border: 1px solid #26526E; border-radius: 10px;
    padding: 10px 16px; cursor: pointer;
  }
  button.action:disabled { opacity: 0.4; cursor: default; }

  .overlay {
    position: fixed; inset: 0; background: rgba(11,31,46,0.88);
    display: none; align-items: center; justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .overlayCard {
    background: #0F2A3D; border: 1px solid #26526E; border-radius: 18px;
    padding: 28px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
    max-width: 300px;
  }
  .overlayCard h2 { font-size: 24px; margin: 8px 0 0; }
  .overlayCard p { color: #7C93A0; font-size: 13px; margin: 0 0 10px; }
  .overlayBtn {
    font-weight: 600; font-size: 14px; color: #0B1F2E; background: #4FBDB4;
    border: none; border-radius: 10px; padding: 10px 20px; cursor: pointer; margin-top: 6px;
  }
</style>
</head>
<body>
<a href="../index.html" style="position:fixed;top:14px;left:14px;z-index:999;background:rgba(0,0,0,0.35);color:#fff;text-decoration:none;font:600 12px -apple-system,sans-serif;padding:8px 14px;border-radius:999px;backdrop-filter:blur(4px);">&larr; Games</a>

<div class="eyebrow" id="levelLabel">PUZZLE 01</div>
<h1>Undertow</h1>
<p class="subtitle">tap 1, then trace one path through every cell in order</p>

<div class="statsRow">
  <div class="stat">⏱ <span id="timer">00:00</span></div>
  <div class="stat">💡 <span id="hintCount">0</span> hints</div>
</div>

<div id="board"></div>

<div class="controls">
  <button class="action" id="newBtn">↻ New puzzle</button>
  <button class="action" id="restartBtn">⟲ Restart</button>
  <button class="action" id="hintBtn">💡 Hint</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlayCard">
    <span style="font-size:28px;">🌊</span>
    <h2>Path complete</h2>
    <p id="overlayStats"></p>
    <button class="overlayBtn" id="nextBtn">Next puzzle →</button>
  </div>
</div>

<script>
(function () {
  var SIZE = 5;
  var TOTAL = SIZE * SIZE;

  function neighborsOf(id) {
    var r = Math.floor(id / SIZE), c = id % SIZE;
    var n = [];
    if (r > 0) n.push(id - SIZE);
    if (r < SIZE - 1) n.push(id + SIZE);
    if (c > 0) n.push(id - 1);
    if (c < SIZE - 1) n.push(id + 1);
    return n;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function randomHamiltonianPath() {
    for (var attempt = 0; attempt < 150; attempt++) {
      var start = Math.floor(Math.random() * TOTAL);
      var path = [start];
      var visited = {};
      visited[start] = true;
      if (dfs(path, visited)) return path;
    }
    // guaranteed fallback: boustrophedon (snake) path always covers a rectangular grid
    var snake = [];
    for (var r = 0; r < SIZE; r++) {
      if (r % 2 === 0) {
        for (var c = 0; c < SIZE; c++) snake.push(r * SIZE + c);
      } else {
        for (var c2 = SIZE - 1; c2 >= 0; c2--) snake.push(r * SIZE + c2);
      }
    }
    return snake;

    function dfs(path, visited) {
      if (path.length === TOTAL) return true;
      var last = path[path.length - 1];
      var options = shuffle(neighborsOf(last).filter(function (n) { return !visited[n]; }));
      for (var i = 0; i < options.length; i++) {
        var n = options[i];
        path.push(n); visited[n] = true;
        if (dfs(path, visited)) return true;
        path.pop(); delete visited[n];
      }
      return false;
    }
  }

  function generatePuzzle() {
    var truePath = randomHamiltonianPath(); // truePath[i] = cellId at step i+1
    var interval = Math.random() < 0.5 ? 3 : 4;
    var clueMap = {}; // cellId -> clue number
    for (var i = 0; i < TOTAL; i++) {
      var stepNum = i + 1;
      if (i === 0 || i === TOTAL - 1 || i % interval === 0) {
        clueMap[truePath[i]] = stepNum;
      }
    }
    var startCell = truePath[0];
    return { truePath: truePath, clueMap: clueMap, startCell: startCell };
  }

  // ---- state ----
  var level = 1;
  var puzzle = generatePuzzle();
  var path = [];
  var solved = false;
  var seconds = 0;
  var hintsUsed = 0;
  var hintedCell = null;
  var timerHandle = null;
  var dragging = false;
  var lastPointerCell = null;

  var boardEl = document.getElementById("board");
  var overlayEl = document.getElementById("overlay");

  function isAdjacent(a, b) { return neighborsOf(a).indexOf(b) !== -1; }

  function formatTime(s) {
    var m = Math.floor(s / 60).toString().padStart(2, "0");
    var ss = Math.floor(s % 60).toString().padStart(2, "0");
    return m + ":" + ss;
  }

  function startTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      if (!solved) {
        seconds++;
        document.getElementById("timer").textContent = formatTime(seconds);
      }
    }, 1000);
  }

  function cellCenter(i) { return i * (58 + 7) + 29; }

  function render() {
    document.getElementById("levelLabel").textContent = "PUZZLE " + String(level).padStart(2, "0");
    document.getElementById("hintCount").textContent = hintsUsed;
    document.getElementById("timer").textContent = formatTime(seconds);

    boardEl.innerHTML = "";

    // SVG path line
    var boardPx = SIZE * 58 + (SIZE - 1) * 7;
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", boardPx);
    svg.setAttribute("height", boardPx);
    svg.style.position = "absolute";
    svg.style.top = "10px";
    svg.style.left = "10px";
    svg.style.pointerEvents = "none";
    svg.style.zIndex = "1";
    if (path.length > 1) {
      var pts = path.map(function (id) {
        var r = Math.floor(id / SIZE), c = id % SIZE;
        return cellCenter(c) + "," + cellCenter(r);
      }).join(" ");
      var poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      poly.setAttribute("points", pts);
      poly.setAttribute("fill", "none");
      poly.setAttribute("stroke", "#2FA6A0");
      poly.setAttribute("stroke-width", "6");
      poly.setAttribute("stroke-linecap", "round");
      poly.setAttribute("stroke-linejoin", "round");
      poly.setAttribute("opacity", "0.85");
      svg.appendChild(poly);
    }
    boardEl.appendChild(svg);

    var pathIndexOf = {};
    path.forEach(function (id, idx) { pathIndexOf[id] = idx + 1; });

    for (var i = 0; i < TOTAL; i++) {
      var div = document.createElement("div");
      var isClue = puzzle.clueMap.hasOwnProperty(i);
      var isFilled = pathIndexOf.hasOwnProperty(i);
      var isStart = i === puzzle.startCell;
      var cls = "cell";
      if (isClue && !isFilled) cls += " clue";
      if (isFilled) cls += " filled";
      if (isStart && !isFilled) cls += " start";
      if (hintedCell === i) cls += " hinted";
      if (!isFilled && !isClue) cls += " blank-dot";
      div.className = cls;

      if (isFilled) {
        div.textContent = pathIndexOf[i];
      } else if (isClue) {
        div.textContent = puzzle.clueMap[i];
      }

      div.setAttribute("data-cell-id", i);
      div.style.touchAction = "none";
      (function (cellId) {
        div.addEventListener("pointerdown", function () {
          dragging = true;
          lastPointerCell = cellId;
          handleCellClick(cellId);
        });
      })(i);

      boardEl.appendChild(div);
    }

    if (solved) {
      document.getElementById("overlayStats").textContent =
        formatTime(seconds) + " · " + hintsUsed + " hint" + (hintsUsed === 1 ? "" : "s");
      overlayEl.classList.add("show");
    } else {
      overlayEl.classList.remove("show");
    }
  }

  function flashInvalid(id) {
    var el = boardEl.children[id + 1]; // +1 to skip the svg element
    if (el) {
      el.classList.add("shake");
      setTimeout(function () { el.classList.remove("shake"); }, 300);
    }
  }

  function handleCellClick(id) {
    if (solved) return;

    if (path.length === 0) {
      if (id !== puzzle.startCell) { flashInvalid(id); return; }
      path = [id];
      render();
      return;
    }

    var last = path[path.length - 1];
    if (id === last) return;

    // jump-back: tapping any earlier cell already in the path rewinds to it
    var existingIdx = path.indexOf(id);
    if (existingIdx !== -1) {
      path = path.slice(0, existingIdx + 1);
      render();
      return;
    }

    if (!isAdjacent(last, id)) { flashInvalid(id); return; }

    var newStep = path.length + 1;
    var clueHere = puzzle.clueMap[id];
    if (clueHere !== undefined && clueHere !== newStep) { flashInvalid(id); return; }

    path.push(id);
    hintedCell = null;
    render();

    if (path.length === TOTAL) {
      solved = true;
      render();
    }
  }

  function newPuzzle(nextLevel) {
    puzzle = generatePuzzle();
    path = [];
    solved = false;
    seconds = 0;
    hintsUsed = 0;
    hintedCell = null;
    if (nextLevel) level = nextLevel;
    render();
  }

  document.getElementById("newBtn").addEventListener("click", function () { newPuzzle(level); });
  document.getElementById("nextBtn").addEventListener("click", function () { newPuzzle(level + 1); });
  document.getElementById("restartBtn").addEventListener("click", function () {
    path = [];
    solved = false;
    hintedCell = null;
    render();
  });
  document.getElementById("hintBtn").addEventListener("click", function () {
    if (solved) return;
    var nextIdx = path.length; // 0-indexed position in truePath for the next step
    if (nextIdx >= TOTAL) return;
    var suggestion = puzzle.truePath[nextIdx];
    // only meaningful if it's actually reachable from current last cell
    if (path.length > 0 && !isAdjacent(path[path.length - 1], suggestion)) return;
    hintsUsed++;
    hintedCell = suggestion;
    render();
    setTimeout(function () { hintedCell = null; render(); }, 1400);
  });

  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var point = e.touches ? e.touches[0] : e;
    var el = document.elementFromPoint(point.clientX, point.clientY);
    var target = el && el.closest("[data-cell-id]");
    if (target) {
      var cellId = Number(target.getAttribute("data-cell-id"));
      if (cellId !== lastPointerCell) {
        lastPointerCell = cellId;
        handleCellClick(cellId);
      }
    }
  });
  window.addEventListener("pointerup", function () {
    dragging = false;
    lastPointerCell = null;
  });

  render();
  startTimer();
})();
</script>
</body>
</html>

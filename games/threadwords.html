<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Threadwords</title>
<meta name="description" content="Trace every tile, leave no thread loose — a word-tracing puzzle game." />
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #14182B; }
  .tw-cell { transition: transform 120ms ease, background 150ms ease, box-shadow 150ms ease; }
  .tw-cell:active { transform: scale(0.96); }
  @keyframes tw-pop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .tw-pop { animation: tw-pop 380ms ease; }
  @keyframes tw-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .tw-shake { animation: tw-shake 300ms ease; }
  @keyframes tw-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<a href="../index.html" style="position:fixed;top:14px;left:14px;z-index:999;background:rgba(0,0,0,0.35);color:#fff;text-decoration:none;font:600 12px -apple-system,sans-serif;padding:8px 14px;border-radius:999px;backdrop-filter:blur(4px);">&larr; Games</a>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
const { useState, useRef, useEffect, useCallback } = React;
const h = React.createElement;

/* ---------------------------------------------------------------
   Word banks by length
--------------------------------------------------------------- */
const WORDS_BY_LENGTH = {
  3: ["CAT","DOG","SUN","RUN","BOX","KEY","MAP","OWL","FOX","ICE","TEA","BEE","PEN","JAR","NET","LOG","RAY","OAK","ARM","EAR","EGG","INK","OAR","WEB"],
  4: ["MOON","STAR","LEAF","FIRE","WIND","LAKE","BIRD","GOLD","SAND","SNOW","ROSE","BONE","FISH","CAVE","VINE","DUNE","MIST","REEF","CORE","HERB","KELP","PALM","RUST","SILK"],
  5: ["RIVER","STONE","CLOUD","BEACH","EAGLE","MAPLE","HONEY","GRAPE","THORN","CORAL","AMBER","BLAZE","FROST","GRAIN","HEART","IVORY","LUNAR","MARSH","OCEAN","PEARL","QUART","SHELL","TIGER","WHEAT","BRICK"],
  6: ["FOREST","DESERT","GARDEN","ISLAND","CASTLE","VOYAGE","METEOR","GLACIE","BREEZE","CANYON","COTTON","EMBERS","GINGER","HARBOR","JUNGLE","LAGOON","MARBLE","ORCHID","PLANET","RIBBON","SPRUCE","TUNDRA","VELVET","WALNUT"],
};

const SIZE = 5;
const TARGET_LENGTHS = [3, 4, 5, 6];

/* ---------------------------------------------------------------
   Puzzle generator: random non-overlapping self-avoiding paths
--------------------------------------------------------------- */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function neighborsOf(id, size) {
  const r = Math.floor(id / size), c = id % size;
  const n = [];
  if (r > 0) n.push(id - size);
  if (r < size - 1) n.push(id + size);
  if (c > 0) n.push(id - 1);
  if (c < size - 1) n.push(id + 1);
  return n;
}

function attemptWalk(start, len, available, size) {
  const path = [start];
  const visited = new Set([start]);
  function dfs() {
    if (path.length === len) return true;
    const last = path[path.length - 1];
    const options = shuffle(
      neighborsOf(last, size).filter((n) => available.has(n) && !visited.has(n))
    );
    for (const n of options) {
      path.push(n);
      visited.add(n);
      if (dfs()) return true;
      path.pop();
      visited.delete(n);
    }
    return false;
  }
  return dfs() ? [...path] : null;
}

function generatePaths(size, lengths) {
  const allCells = Array.from({ length: size * size }, (_, i) => i);
  for (let outer = 0; outer < 60; outer++) {
    const available = new Set(allCells);
    const order = shuffle(lengths.map((l, i) => i));
    const paths = new Array(lengths.length);

    function place(k) {
      if (k === order.length) return true;
      const idx = order[k];
      const len = lengths[idx];
      const starts = shuffle([...available]);
      for (const s of starts) {
        const path = attemptWalk(s, len, available, size);
        if (path) {
          path.forEach((c) => available.delete(c));
          paths[idx] = path;
          if (place(k + 1)) return true;
          path.forEach((c) => available.add(c));
        }
      }
      return false;
    }

    if (place(0)) return paths;
  }
  return null;
}

function pickWord(length, usedRef) {
  const bank = WORDS_BY_LENGTH[length];
  if (!usedRef.current[length]) usedRef.current[length] = new Set();
  const used = usedRef.current[length];
  let choices = bank.filter((w) => !used.has(w));
  if (choices.length === 0) {
    used.clear();
    choices = bank;
  }
  const word = choices[Math.floor(Math.random() * choices.length)];
  used.add(word);
  return word;
}

function generatePuzzle(usedWordsRef) {
  const lengths = shuffle(TARGET_LENGTHS);
  const paths = generatePaths(SIZE, lengths);
  if (!paths) return generatePuzzle(usedWordsRef);

  const cellMeta = {};
  const words = paths.map((path, i) => {
    const length = lengths[i];
    const word = pickWord(length, usedWordsRef);
    const reversed = Math.random() < 0.5;
    const letters = reversed ? [...word].reverse() : [...word];
    path.forEach((cellId, k) => {
      cellMeta[cellId] = letters[k];
    });
    return { word, length, path, found: false };
  });

  const cells = Array.from({ length: SIZE * SIZE }, (_, id) => ({
    id,
    row: Math.floor(id / SIZE),
    col: id % SIZE,
    letter: cellMeta[id] || null,
    isWall: !(id in cellMeta),
  }));

  return { cells, words };
}

function isAdjacent(a, b, size) {
  return neighborsOf(a, size).includes(b);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = Math.floor(sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

const CELL = 58;
const GAP = 7;
const cellCenter = (i) => i * (CELL + GAP) + CELL / 2;
const STORAGE_KEY = "threadwords-progress";

const Icon = { clock: "⏱", bulb: "💡", trophy: "🏆", refresh: "↻", phone: "📱", close: "✕" };

const styles = {
  page: { minHeight: "100vh", background: "#14182B", display: "flex", flexDirection: "column", alignItems: "center", padding: "36px 16px 48px", position: "relative" },
  header: { textAlign: "center", marginBottom: 18 },
  eyebrow: { fontFamily: "'Space Grotesk', sans-serif", fontSize: 11, letterSpacing: "0.2em", color: "#C9A24B", marginBottom: 6 },
  title: { fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 40, color: "#F1E9D8", margin: 0, letterSpacing: "-0.01em" },
  subtitle: { fontFamily: "'Space Grotesk', sans-serif", color: "#8B90AC", fontSize: 13, marginTop: 4 },
  installBtn: { display: "inline-flex", alignItems: "center", gap: 6, marginTop: 12, fontFamily: "'Space Grotesk', sans-serif", fontWeight: 500, fontSize: 12, color: "#C9A24B", background: "transparent", border: "1px solid #C9A24B55", borderRadius: 999, padding: "6px 14px", cursor: "pointer" },
  closeBtn: { position: "absolute", top: 12, right: 12, background: "transparent", border: "none", cursor: "pointer", padding: 4, lineHeight: 0, color: "#8B90AC", fontSize: 14 },
  statsRow: { display: "flex", gap: 18, marginBottom: 16, fontFamily: "'Space Grotesk', sans-serif", color: "#C9A24B", fontSize: 13 },
  stat: { display: "flex", alignItems: "center", gap: 6 },
  board: { position: "relative", background: "#191D33", borderRadius: 20, padding: 0 },
  wordRow: { display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center", marginTop: 22, maxWidth: 340 },
  wordChip: (found) => ({ fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", padding: "6px 12px", borderRadius: 999, color: found ? "#14182B" : "#8B90AC", background: found ? "#C9A24B" : "#1F2340" }),
  controls: { display: "flex", gap: 12, marginTop: 22 },
  btn: { display: "flex", alignItems: "center", gap: 8, fontFamily: "'Space Grotesk', sans-serif", fontWeight: 500, fontSize: 13, color: "#F1E9D8", background: "#1F2340", border: "1px solid #2E3358", borderRadius: 10, padding: "10px 16px", cursor: "pointer" },
  overlay: { position: "absolute", inset: 0, background: "rgba(20,24,43,0.82)", display: "flex", alignItems: "center", justifyContent: "center", animation: "tw-rise 300ms ease" },
  overlayCard: { position: "relative", background: "#1B1F3B", border: "1px solid #2E3358", borderRadius: 18, padding: "28px 32px", textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 6, animation: "tw-rise 380ms ease" },
  overlayTitle: { fontFamily: "'Fraunces', serif", color: "#F1E9D8", fontSize: 24, margin: "8px 0 0" },
  overlaySub: { fontFamily: "'Space Grotesk', sans-serif", color: "#8B90AC", fontSize: 13, marginBottom: 10 },
  overlayBtn: { fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, color: "#14182B", background: "#C9A24B", border: "none", borderRadius: 10, padding: "10px 20px", cursor: "pointer", marginTop: 6 },
};

function Threadwords() {
  const usedWordsRef = useRef({});
  const [level, setLevel] = useState(1);
  const [puzzle, setPuzzle] = useState(null);
  const [path, setPath] = useState([]);
  const [dragging, setDragging] = useState(false);
  const [usedCells, setUsedCells] = useState(new Set());
  const [flash, setFlash] = useState(null);
  const [hintPath, setHintPath] = useState(null);
  const [hintsUsed, setHintsUsed] = useState(0);
  const [seconds, setSeconds] = useState(0);
  const [complete, setComplete] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [showInstallHelp, setShowInstallHelp] = useState(false);
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const boardRef = useRef(null);

  const allFound = puzzle && puzzle.words.every((w) => w.found);

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  const handleInstallClick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      setDeferredPrompt(null);
    } else {
      setShowInstallHelp(true);
    }
  };

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        usedWordsRef.current = Object.fromEntries(
          Object.entries(saved.usedWordsByLength || {}).map(([len, arr]) => [len, new Set(arr)])
        );
        setPuzzle(saved.puzzle);
        setLevel(saved.level || 1);
        setUsedCells(new Set(saved.usedCells || []));
        setHintsUsed(saved.hintsUsed || 0);
        setSeconds(saved.seconds || 0);
      } else {
        setPuzzle(generatePuzzle(usedWordsRef));
      }
    } catch (e) {
      setPuzzle(generatePuzzle(usedWordsRef));
    }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded || !puzzle) return;
    const handle = setTimeout(() => {
      try {
        const payload = JSON.stringify({
          puzzle, level, usedCells: [...usedCells], hintsUsed, seconds,
          usedWordsByLength: Object.fromEntries(
            Object.entries(usedWordsRef.current).map(([len, set]) => [len, [...set]])
          ),
        });
        localStorage.setItem(STORAGE_KEY, payload);
      } catch (e) {}
    }, 400);
    return () => clearTimeout(handle);
  }, [puzzle, level, usedCells, hintsUsed, loaded]);

  useEffect(() => { if (allFound && !complete) setComplete(true); }, [allFound, complete]);

  useEffect(() => {
    if (complete || !loaded) return;
    const t = setInterval(() => setSeconds((s) => s + 1), 1000);
    return () => clearInterval(t);
  }, [complete, level, loaded]);

  const newLevel = useCallback((nextLevel) => {
    setPuzzle(generatePuzzle(usedWordsRef));
    setPath([]);
    setUsedCells(new Set());
    setHintPath(null);
    setSeconds(0);
    setComplete(false);
    if (nextLevel) setLevel(nextLevel);
  }, []);

  const cellById = (id) => (puzzle ? puzzle.cells[id] : null);

  const canStart = (id) => {
    const c = cellById(id);
    return c && !c.isWall && !usedCells.has(id);
  };

  const extendPath = useCallback((id) => {
    setPath((prev) => {
      if (prev.length === 0) return prev;
      const last = prev[prev.length - 1];
      if (id === last) return prev;
      if (prev.length > 1 && id === prev[prev.length - 2]) return prev.slice(0, -1);
      const c = cellById(id);
      if (!c || c.isWall || usedCells.has(id)) return prev;
      if (prev.includes(id)) return prev;
      if (!isAdjacent(last, id, SIZE)) return prev;
      return [...prev, id];
    });
  }, [usedCells, puzzle]);

  const handlePointerDown = (id) => {
    if (!canStart(id)) return;
    setDragging(true);
    setFlash(null);
    setPath([id]);
  };

  const finishPath = useCallback(() => {
    setDragging(false);
    setPath((currentPath) => {
      if (currentPath.length < 3) return [];
      const letters = currentPath.map((id) => cellById(id).letter).join("");
      const reversed = [...letters].reverse().join("");
      const matchIdx = puzzle.words.findIndex((w) => !w.found && (w.word === letters || w.word === reversed));
      if (matchIdx !== -1) {
        setPuzzle((p) => {
          const words = [...p.words];
          words[matchIdx] = { ...words[matchIdx], found: true };
          return { ...p, words };
        });
        setUsedCells((prev) => {
          const next = new Set(prev);
          currentPath.forEach((id) => next.add(id));
          return next;
        });
        setFlash("good");
      } else {
        setFlash("bad");
      }
      setTimeout(() => setFlash(null), 400);
      return [];
    });
  }, [puzzle]);

  useEffect(() => {
    if (!dragging) return;
    const onMove = (e) => {
      const point = e.touches ? e.touches[0] : e;
      const el = document.elementFromPoint(point.clientX, point.clientY);
      const target = el && el.closest("[data-cell-id]");
      if (target) extendPath(Number(target.getAttribute("data-cell-id")));
    };
    const onUp = () => finishPath();
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
  }, [dragging, extendPath, finishPath]);

  if (!loaded || !puzzle) {
    return h("div", { style: styles.page },
      h("div", { style: { ...styles.subtitle, marginTop: 120, fontSize: 15 } }, "Loading your board…")
    );
  }

  const useHint = () => {
    const unfound = puzzle.words.filter((w) => !w.found);
    if (unfound.length === 0) return;
    const pick = unfound[Math.floor(Math.random() * unfound.length)];
    setHintPath(pick.path);
    setHintsUsed((hh) => hh + 1);
    setTimeout(() => setHintPath(null), 1400);
  };

  const boardPx = SIZE * CELL + (SIZE - 1) * GAP;
  const pathPoints = (ids) => ids.map((id) => {
    const c = cellById(id);
    return `${cellCenter(c.col)},${cellCenter(c.row)}`;
  }).join(" ");

  return h("div", { style: styles.page },
    h("div", { style: styles.header },
      h("div", { style: styles.eyebrow }, `LEVEL ${level.toString().padStart(2, "0")}`),
      h("h1", { style: styles.title }, "Threadwords"),
      h("p", { style: styles.subtitle }, "trace every tile, leave no thread loose"),
      h("button", { style: styles.installBtn, onClick: handleInstallClick }, `${Icon.phone} Add to Home Screen`)
    ),
    h("div", { style: styles.statsRow },
      h("div", { style: styles.stat }, h("span", null, Icon.clock), h("span", null, formatTime(seconds))),
      h("div", { style: styles.stat }, h("span", null, Icon.bulb), h("span", null, `${hintsUsed} hints`))
    ),
    h("div", {
      ref: boardRef,
      style: { ...styles.board, width: boardPx, height: boardPx,
        boxShadow: flash === "bad" ? "0 0 0 3px #C1443C55" : flash === "good" ? "0 0 0 3px #1F6F6355" : "0 10px 30px rgba(0,0,0,0.35)" },
      className: flash === "bad" ? "tw-shake" : "",
    },
      h("svg", { width: boardPx, height: boardPx, style: { position: "absolute", top: 0, left: 0, pointerEvents: "none" } },
        puzzle.words.filter((w) => w.found).map((w, i) =>
          h("polyline", { key: "f" + i, points: pathPoints(w.path), fill: "none", stroke: "#1F6F63", strokeWidth: "7", strokeLinecap: "round", strokeLinejoin: "round", strokeDasharray: "1 14", opacity: "0.9" })
        ),
        hintPath && h("polyline", { points: pathPoints(hintPath), fill: "none", stroke: "#C9A24B", strokeWidth: "7", strokeLinecap: "round", strokeLinejoin: "round", opacity: "0.55" }),
        path.length > 1 && h("polyline", { points: pathPoints(path), fill: "none", stroke: "#E4572E", strokeWidth: "7", strokeLinecap: "round", strokeLinejoin: "round" })
      ),
      puzzle.cells.map((cell) => {
        const inPath = path.includes(cell.id);
        const isUsed = usedCells.has(cell.id);
        const isHint = hintPath && hintPath.includes(cell.id);
        return h("div", {
          key: cell.id,
          "data-cell-id": cell.id,
          onPointerDown: () => handlePointerDown(cell.id),
          className: `tw-cell ${isUsed ? "tw-pop" : ""}`,
          style: {
            position: "absolute", left: cell.col * (CELL + GAP), top: cell.row * (CELL + GAP),
            width: CELL, height: CELL, borderRadius: 14, display: "flex", alignItems: "center", justifyContent: "center",
            fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 22, userSelect: "none", touchAction: "none",
            cursor: cell.isWall ? "default" : "pointer",
            color: cell.isWall ? "transparent" : isUsed ? "#F1E9D8" : "#241F1A",
            background: cell.isWall ? "repeating-linear-gradient(135deg, #20243B, #20243B 6px, #262A45 6px, #262A45 12px)"
              : isUsed ? "#1F6F63" : inPath ? "#F3D9C8" : isHint ? "#F6E6B8" : "#F1E9D8",
            boxShadow: cell.isWall ? "inset 0 0 0 1px #ffffff10" : inPath ? "0 0 0 2px #E4572E" : "0 2px 4px rgba(0,0,0,0.15)",
          },
        }, cell.letter);
      })
    ),
    h("div", { style: styles.wordRow },
      puzzle.words.map((w, i) =>
        h("div", { key: i, style: styles.wordChip(w.found) }, w.found ? w.word : "· ".repeat(w.length).trim())
      )
    ),
    h("div", { style: styles.controls },
      h("button", { style: styles.btn, onClick: () => newLevel(level) }, `${Icon.refresh} New board`),
      h("button", { style: styles.btn, onClick: useHint, disabled: allFound }, `${Icon.bulb} Hint`)
    ),
    showInstallHelp && h("div", { style: styles.overlay },
      h("div", { style: { ...styles.overlayCard, maxWidth: 320, alignItems: "flex-start", textAlign: "left" } },
        h("button", { style: styles.closeBtn, onClick: () => setShowInstallHelp(false), "aria-label": "Close" }, Icon.close),
        h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
          h("span", { style: { fontSize: 18 } }, Icon.phone),
          h("h2", { style: { ...styles.overlayTitle, fontSize: 18, margin: 0 } }, "Add to Home Screen")
        ),
        h("div", { style: { ...styles.subtitle, textAlign: "left", marginTop: 10, fontSize: 13, lineHeight: 1.6 } },
          h("strong", { style: { color: "#F1E9D8" } }, "On Android (Chrome):"), h("br"),
          "Tap the ⋮ menu, top right → \"Add to Home screen\" → Add.", h("br"), h("br"),
          h("strong", { style: { color: "#F1E9D8" } }, "On iPhone (Safari):"), h("br"),
          "Tap the Share icon → \"Add to Home Screen\" → Add.", h("br"), h("br"),
          "It'll open full-screen from your home screen from then on, and your progress stays saved."
        )
      )
    ),
    complete && h("div", { style: styles.overlay },
      h("div", { style: styles.overlayCard },
        h("span", { style: { fontSize: 28 } }, Icon.trophy),
        h("h2", { style: styles.overlayTitle }, "Board complete"),
        h("p", { style: styles.overlaySub }, `${formatTime(seconds)} · ${hintsUsed} hint${hintsUsed === 1 ? "" : "s"}`),
        h("button", { style: styles.overlayBtn, onClick: () => newLevel(level + 1) }, "Next level →")
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(Threadwords));
</script>
</body>
</html>

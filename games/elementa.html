<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Elementa</title>
<meta name="description" content="Combine fire, water, earth and air to reach today's target element." />
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #1B1712; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #F1E6D3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 16px 48px;
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.22em; color: #D9A441; margin-bottom: 6px; text-align: center; }
  h1 { font-size: 38px; margin: 0; text-align: center; letter-spacing: -0.01em; font-weight: 700; }
  .subtitle { color: #A8998A; font-size: 13px; margin: 4px 0 0; text-align: center; }
  .targetRow { display: flex; align-items: center; gap: 10px; margin: 18px 0 14px; background: #2A231B; border: 1px solid #3D3327; border-radius: 14px; padding: 10px 18px; }
  .targetLabel { font-size: 11px; letter-spacing: 0.12em; color: #A8998A; }
  .targetTile { font-size: 26px; }
  .targetName { font-weight: 600; font-size: 15px; color: #F1E6D3; }
  .statsRow { display: flex; gap: 18px; font-size: 13px; color: #D9A441; margin-bottom: 14px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  #board {
    display: grid;
    grid-template-columns: repeat(5, 58px);
    grid-template-rows: repeat(5, 58px);
    gap: 7px;
    background: #221C15;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .cell {
    width: 58px; height: 58px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    cursor: pointer;
    background: #2E271D;
    border: 2px solid transparent;
    transition: transform 100ms ease, background 150ms ease, border-color 150ms ease;
    user-select: none;
  }
  .cell:active { transform: scale(0.94); }
  .cell.empty { background: repeating-linear-gradient(135deg, #201A14, #201A14 6px, #26201A 6px, #26201A 12px); cursor: default; }
  .cell.selected { border-color: #D9A441; background: #3A3020; }
  .cell.target-made { animation: pop 400ms ease; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .cell.shake { animation: shake 300ms ease; }
  .cell.hinted { border-color: #D9A441; background: #3A3020; box-shadow: 0 0 0 2px #D9A44155; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 340px; margin-top: 22px; }
  .legendItem { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A8998A; background: #2A231B; border-radius: 999px; padding: 6px 10px; }

  .controls { display: flex; gap: 12px; margin-top: 22px; }
  button.action {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: #F1E6D3;
    background: #2A231B; border: 1px solid #3D3327; border-radius: 10px;
    padding: 10px 16px; cursor: pointer;
  }
  button.action:disabled { opacity: 0.4; cursor: default; }

  .overlay {
    position: fixed; inset: 0; background: rgba(27,23,18,0.88);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .overlayCard {
    background: #221C15; border: 1px solid #3D3327; border-radius: 18px;
    padding: 28px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
    max-width: 320px;
  }
  .overlayCard h2 { font-size: 24px; margin: 8px 0 0; }
  .overlayCard p { color: #A8998A; font-size: 13px; margin: 0 0 10px; }
  .overlayBtn {
    font-weight: 600; font-size: 14px; color: #1B1712; background: #D9A441;
    border: none; border-radius: 10px; padding: 10px 20px; cursor: pointer; margin-top: 6px;
  }
</style>
</head>
<body>
<a href="../index.html" style="position:fixed;top:14px;left:14px;z-index:999;background:rgba(0,0,0,0.35);color:#fff;text-decoration:none;font:600 12px -apple-system,sans-serif;padding:8px 14px;border-radius:999px;backdrop-filter:blur(4px);">&larr; Games</a>

<div class="eyebrow" id="levelLabel">LEVEL 01</div>
<h1>Elementa</h1>
<p class="subtitle">combine adjacent elements to reach the target</p>

<div class="targetRow">
  <span class="targetLabel">TARGET</span>
  <span class="targetTile" id="targetEmoji"></span>
  <span class="targetName" id="targetName"></span>
</div>

<div class="statsRow">
  <div class="stat">⏱ <span id="timer">00:00</span></div>
  <div class="stat">↺ <span id="moveCount">0</span> moves</div>
</div>

<div id="board"></div>

<div class="legend" id="legend"></div>

<div class="controls">
  <button class="action" id="newBoardBtn">↻ New puzzle</button>
  <button class="action" id="hintBtn">💡 Hint</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlayCard">
    <span style="font-size:28px;">🏆</span>
    <h2>Element created!</h2>
    <p id="overlayStats"></p>
    <button class="overlayBtn" id="nextBtn">Next puzzle →</button>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "elementa-progress-v2";

  var BASE = {
    FIRE:  { emoji: "🔥", name: "Fire" },
    WATER: { emoji: "💧", name: "Water" },
    EARTH: { emoji: "🌍", name: "Earth" },
    AIR:   { emoji: "💨", name: "Air" },
  };
  var BASE_KEYS = Object.keys(BASE);

  var COMBOS = [
    { pair: ["FIRE", "WATER"], key: "STEAM", emoji: "♨️", name: "Steam", tier: 2 },
    { pair: ["FIRE", "EARTH"], key: "LAVA", emoji: "🌋", name: "Lava", tier: 2 },
    { pair: ["FIRE", "AIR"],   key: "SMOKE", emoji: "🌫️", name: "Smoke", tier: 2 },
    { pair: ["WATER", "EARTH"], key: "MUD", emoji: "🟤", name: "Mud", tier: 2 },
    { pair: ["WATER", "AIR"],  key: "RAIN", emoji: "🌧️", name: "Rain", tier: 2 },
    { pair: ["EARTH", "AIR"],  key: "DUST", emoji: "🌪️", name: "Dust", tier: 2 },
    { pair: ["LAVA", "WATER"], key: "STONE", emoji: "🪨", name: "Stone", tier: 3 },
    { pair: ["STEAM", "EARTH"], key: "CLAY", emoji: "🧱", name: "Clay", tier: 3 },
    { pair: ["DUST", "FIRE"], key: "GLASS", emoji: "🔷", name: "Glass", tier: 3 },
    { pair: ["MUD", "AIR"], key: "BRICK", emoji: "🟧", name: "Brick", tier: 3 },
  ];
  var TIER2 = COMBOS.filter(function (c) { return c.tier === 2; });
  var TIER3 = COMBOS.filter(function (c) { return c.tier === 3; });

  function comboFor(a, b) {
    if (a === b) return null;
    for (var i = 0; i < COMBOS.length; i++) {
      var p = COMBOS[i].pair;
      if ((p[0] === a && p[1] === b) || (p[0] === b && p[1] === a)) return COMBOS[i];
    }
    return null;
  }

  var SIZE = 5;

  function neighborsOf(id) {
    var r = Math.floor(id / SIZE), c = id % SIZE;
    var n = [];
    if (r > 0) n.push(id - SIZE);
    if (r < SIZE - 1) n.push(id + SIZE);
    if (c > 0) n.push(id - 1);
    if (c < SIZE - 1) n.push(id + 1);
    return n;
  }

  function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function generatePuzzle() {
    // Always target a tier-3 element: requires combining two base elements
    // into a tier-2 midpoint, THEN combining that midpoint with a third base
    // element. One lucky adjacent pair can no longer solve it in one move.
    var target = randChoice(TIER3);
    var midKey = target.pair[0]; // tier-2 element, e.g. LAVA
    var finisherKey = target.pair[1]; // base element, e.g. WATER
    var midRecipe = COMBOS.filter(function (c) { return c.key === midKey; })[0];
    var baseX = midRecipe.pair[0], baseY = midRecipe.pair[1];

    var cells = [];
    for (var i = 0; i < SIZE * SIZE; i++) {
      cells.push({ id: i, type: randChoice(BASE_KEYS), empty: false });
    }

    // place the hidden solution path: slotA + slotB -> mid, then slotA + slotC -> target
    var slotA = Math.floor(Math.random() * SIZE * SIZE);
    var aNeighbors = neighborsOf(slotA);
    // need at least 2 distinct neighbors for slotB and slotC
    var shuffled = aNeighbors.slice().sort(function () { return Math.random() - 0.5; });
    var slotB = shuffled[0];
    var slotC = shuffled[1];

    cells[slotA].type = baseX;
    cells[slotB].type = baseY;
    cells[slotC].type = finisherKey;

    return {
      target: target,
      cells: cells,
      hintPath: [slotA, slotB, slotC],
      midKey: midKey,
    };
  }

  // ---- state ----
  var level = 1;
  var puzzle = null;
  var selected = null;
  var moves = 0;
  var seconds = 0;
  var timerHandle = null;
  var solved = false;
  var hintedCells = [];
  var hintsUsed = 0;

  var boardEl = document.getElementById("board");
  var overlayEl = document.getElementById("overlay");

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        level: level, puzzle: puzzle, moves: moves, seconds: seconds, solved: solved
      }));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        level = saved.level || 1;
        puzzle = saved.puzzle;
        moves = saved.moves || 0;
        seconds = saved.seconds || 0;
        solved = !!saved.solved;
        return true;
      }
    } catch (e) {}
    return false;
  }

  function startTimer() {
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(function () {
      if (!solved) {
        seconds++;
        document.getElementById("timer").textContent = formatTime(seconds);
        save();
      }
    }, 1000);
  }

  function formatTime(s) {
    var m = Math.floor(s / 60).toString().padStart(2, "0");
    var ss = Math.floor(s % 60).toString().padStart(2, "0");
    return m + ":" + ss;
  }

  function elementInfo(key) {
    if (BASE[key]) return BASE[key];
    for (var i = 0; i < COMBOS.length; i++) {
      if (COMBOS[i].key === key) return COMBOS[i];
    }
    return null;
  }

  function render() {
    document.getElementById("levelLabel").textContent = "LEVEL " + String(level).padStart(2, "0");
    var t = puzzle.target;
    document.getElementById("targetEmoji").textContent = t.emoji;
    document.getElementById("targetName").textContent = t.name;
    document.getElementById("moveCount").textContent = moves;
    document.getElementById("timer").textContent = formatTime(seconds);

    boardEl.innerHTML = "";
    puzzle.cells.forEach(function (cell) {
      var div = document.createElement("div");
      var isHinted = hintedCells.indexOf(cell.id) !== -1;
      div.className = "cell" + (cell.empty ? " empty" : "") + (selected === cell.id ? " selected" : "") + (isHinted ? " hinted" : "");
      if (!cell.empty) {
        var info = elementInfo(cell.type);
        div.textContent = info ? info.emoji : "";
        div.addEventListener("click", function () { handleCellClick(cell.id); });
      }
      boardEl.appendChild(div);
    });

    renderLegend();

    if (solved) {
      document.getElementById("overlayStats").textContent =
        moves + " move" + (moves === 1 ? "" : "s") + " · " + formatTime(seconds);
      overlayEl.classList.add("show");
    } else {
      overlayEl.classList.remove("show");
    }
  }

  function renderLegend() {
    var legend = document.getElementById("legend");
    legend.innerHTML = "";
    TIER2.forEach(function (c) {
      var a = BASE[c.pair[0]], b = BASE[c.pair[1]];
      var item = document.createElement("div");
      item.className = "legendItem";
      var isMid = c.key === puzzle.midKey;
      item.style.border = isMid ? "1px solid #D9A441" : "1px solid transparent";
      item.textContent = a.emoji + " + " + b.emoji + " = " + c.emoji + " " + c.name;
      legend.appendChild(item);
    });
  }

  function handleCellClick(id) {
    if (solved) return;
    var cell = puzzle.cells[id];
    if (!cell || cell.empty) return;

    if (selected === null) {
      selected = id;
      render();
      return;
    }
    if (selected === id) {
      selected = null;
      render();
      return;
    }

    var a = puzzle.cells[selected];
    var neighbors = neighborsOf(selected);
    var isAdjacent = neighbors.indexOf(id) !== -1;

    if (!isAdjacent) {
      selected = id;
      render();
      return;
    }

    var combo = comboFor(a.type, cell.type);
    if (!combo) {
      flashInvalid(selected, id);
      selected = null;
      return;
    }

    // valid merge
    a.type = combo.key;
    cell.empty = true;
    moves++;
    selected = null;
    render();

    if (combo.key === puzzle.target.key) {
      solved = true;
      save();
      setTimeout(function () { render(); }, 50);
    } else {
      save();
    }
  }

  function flashInvalid(id1, id2) {
    [id1, id2].forEach(function (id) {
      var el = boardEl.children[id];
      if (el) {
        el.classList.add("shake");
        setTimeout(function () { el.classList.remove("shake"); }, 300);
      }
    });
  }

  function newPuzzle(nextLevel) {
    puzzle = generatePuzzle();
    selected = null;
    moves = 0;
    seconds = 0;
    solved = false;
    hintedCells = [];
    hintsUsed = 0;
    if (nextLevel) level = nextLevel;
    save();
    render();
  }

  document.getElementById("newBoardBtn").addEventListener("click", function () {
    newPuzzle(level);
  });
  document.getElementById("nextBtn").addEventListener("click", function () {
    newPuzzle(level + 1);
  });
  document.getElementById("hintBtn").addEventListener("click", function () {
    if (solved || !puzzle.hintPath) return;
    hintsUsed++;
    // only highlight whichever of the hint cells are still on the board (not yet merged away)
    hintedCells = puzzle.hintPath.filter(function (id) {
      return !puzzle.cells[id].empty;
    });
    render();
    setTimeout(function () { hintedCells = []; render(); }, 1600);
  });

  // ---- init ----
  if (!load() || !puzzle) {
    newPuzzle(1);
  } else {
    render();
  }
  startTimer();
})();
</script>
</body>
</html>

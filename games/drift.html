<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Drift</title>
<meta name="description" content="Time your tap to launch the orbiting ball toward the next point. Endless chain, waiting is always safe." />
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #14102A; overflow: hidden; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #EDE6FA;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    touch-action: manipulation;
  }
  .header { text-align: center; padding: 18px 16px 8px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.22em; color: #7FE0D6; margin-bottom: 4px; }
  h1 { font-size: 32px; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
  .subtitle { color: #9A8FC2; font-size: 12px; margin: 4px 0 0; }
  #wrap { position: relative; flex: 1; width: 100%; max-width: 400px; display: flex; align-items: center; justify-content: center; }
  canvas { background: #1A1533; border-radius: 18px; display: block; touch-action: manipulation; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
  #scoreBadge {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; color: #EDE6FA;
    background: rgba(20,16,42,0.65); padding: 6px 16px; border-radius: 999px;
    letter-spacing: 0.04em;
  }
  .overlay {
    position: absolute; inset: 0; background: rgba(20,16,42,0.88);
    display: none; align-items: center; justify-content: center; border-radius: 18px;
  }
  .overlay.show { display: flex; }
  .overlayCard {
    background: #201A3D; border: 1px solid #35295E; border-radius: 18px;
    padding: 26px 30px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px;
    max-width: 260px;
  }
  .overlayCard h2 { font-size: 22px; margin: 8px 0 0; }
  .overlayCard p { color: #9A8FC2; font-size: 13px; margin: 0 0 10px; }
  .overlayBtn {
    font-weight: 600; font-size: 14px; color: #14102A; background: #7FE0D6;
    border: none; border-radius: 10px; padding: 10px 22px; cursor: pointer; margin-top: 6px;
  }
  .hint { color: #6B5F94; font-size: 12px; text-align: center; padding: 10px 16px 20px; }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">BEST: <span id="bestLabel">0</span></div>
  <h1>Drift</h1>
  <p class="subtitle">tap when the ball faces the next point · waiting is always safe</p>
</div>

<div id="wrap">
  <canvas id="game" width="340" height="600"></canvas>
  <div id="scoreBadge">0</div>

  <div class="overlay show" id="startOverlay">
    <div class="overlayCard">
      <span style="font-size:28px;">🪐</span>
      <h2>Drift</h2>
      <p>The ball orbits automatically.<br/>Tap when it's aimed at the<br/>gold arc to launch onward.<br/>Wrong timing ends the run —<br/>but waiting never does.</p>
      <button class="overlayBtn" id="startBtn">Start</button>
    </div>
  </div>

  <div class="overlay" id="overOverlay">
    <div class="overlayCard">
      <span style="font-size:28px;">🌌</span>
      <h2>Drifted off!</h2>
      <p id="finalScore"></p>
      <button class="overlayBtn" id="retryBtn">Try again</button>
    </div>
  </div>
</div>

<p class="hint">tap anywhere · or press Space</p>

<script>
(function () {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var STORAGE_KEY = "drift-best";

  var ORBIT_RADIUS = 62;
  var SCREEN_ANCHOR_Y = 340;
  var FLIGHT_DURATION = 260; // ms

  var state = "idle"; // idle | orbiting | flying | falling | over
  var current = { x: 0, y: 0 };
  var next = { x: 0, y: 0 };
  var ballAngle = 0;
  var dir = 1; // 1 = clockwise, -1 = counterclockwise
  var omega = 0.045; // rad/frame
  var tolerance = 0.34; // rad, half-width of the good window
  var score = 0;
  var best = 0;
  var camera = { x: 0, y: 0 };

  var flightStart = null, flightFrom = null, flightTo = null, flightCamFrom = null;
  var fallVX = 0, fallVY = 0, fallX = 0, fallY = 0, fallStart = null;

  function loadBest() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      best = v ? parseInt(v, 10) || 0 : 0;
    } catch (e) { best = 0; }
    document.getElementById("bestLabel").textContent = best;
  }
  function saveBest() {
    try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (e) {}
  }

  function normalizeAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  function angleTo(from, to) {
    return Math.atan2(to.y - from.y, to.x - from.x);
  }

  function pickNext(from) {
    var distance = 85 + Math.random() * 45;
    var baseAngle = -Math.PI / 2; // straight up
    var spread = 1.1; // radians either side
    var angle = baseAngle + (Math.random() * 2 - 1) * spread;
    return { x: from.x + Math.cos(angle) * distance, y: from.y + Math.sin(angle) * distance };
  }

  function setupOrbit() {
    dir = Math.random() < 0.5 ? 1 : -1;
    ballAngle = Math.random() * Math.PI * 2;
    state = "orbiting";
  }

  function startGame() {
    current = { x: 0, y: 0 };
    next = pickNext(current);
    score = 0;
    omega = 0.045;
    tolerance = 0.34;
    camera.x = current.x;
    camera.y = current.y;
    setupOrbit();
    document.getElementById("scoreBadge").textContent = "0";
    document.getElementById("startOverlay").classList.remove("show");
    document.getElementById("overOverlay").classList.remove("show");
  }

  function attemptLaunch() {
    if (state !== "orbiting") return;
    var target = angleTo(current, next);
    var diff = normalizeAngle(ballAngle - target);
    if (Math.abs(diff) <= tolerance) {
      // success
      state = "flying";
      flightStart = performance.now();
      flightFrom = { x: current.x, y: current.y };
      flightTo = { x: next.x, y: next.y };
      flightCamFrom = { x: camera.x, y: camera.y };
    } else {
      // failure: launch off in the wrong direction
      state = "falling";
      fallStart = performance.now();
      fallX = current.x + Math.cos(ballAngle) * ORBIT_RADIUS;
      fallY = current.y + Math.sin(ballAngle) * ORBIT_RADIUS;
      fallVX = Math.cos(ballAngle) * 6;
      fallVY = Math.sin(ballAngle) * 6;
    }
  }

  function endGame() {
    state = "over";
    if (score > best) {
      best = score;
      saveBest();
      document.getElementById("bestLabel").textContent = best;
    }
    document.getElementById("finalScore").textContent =
      score + " point" + (score === 1 ? "" : "s") + (score >= best && score > 0 ? " · new best!" : " · best: " + best);
    document.getElementById("overOverlay").classList.add("show");
  }

  function update(now) {
    if (state === "orbiting") {
      ballAngle += dir * omega;
      camera.x = current.x;
      camera.y = current.y;
    } else if (state === "flying") {
      var t = Math.min(1, (now - flightStart) / FLIGHT_DURATION);
      var ease = 1 - Math.pow(1 - t, 3);
      camera.x = flightCamFrom.x + (flightTo.x - flightCamFrom.x) * ease;
      camera.y = flightCamFrom.y + (flightTo.y - flightCamFrom.y) * ease;
      if (t >= 1) {
        current = { x: flightTo.x, y: flightTo.y };
        next = pickNext(current);
        score++;
        document.getElementById("scoreBadge").textContent = String(score);
        omega = Math.min(0.045 + score * 0.0016, 0.09);
        tolerance = Math.max(0.34 - score * 0.006, 0.25);
        setupOrbit();
      }
    } else if (state === "falling") {
      var dt = (now - fallStart) / 16.67;
      fallVY += 0.35;
      fallX += fallVX;
      fallY += fallVY;
      if (now - fallStart > 650) {
        endGame();
      }
    }
  }

  function toScreen(wx, wy) {
    return { x: wx - camera.x + W / 2, y: wy - camera.y + SCREEN_ANCHOR_Y };
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    // background starfield-ish dots (static, cheap)
    ctx.fillStyle = "#2A2154";
    for (var i = 0; i < 18; i++) {
      var sx = (i * 53 + (camera.x * 0.15)) % W;
      if (sx < 0) sx += W;
      var sy = (i * 91 + (camera.y * 0.15)) % H;
      if (sy < 0) sy += H;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }

    var curScreen = toScreen(current.x, current.y);
    var nextScreen = toScreen(next.x, next.y);

    if (state === "orbiting" || state === "flying") {
      // guide line to next point
      ctx.strokeStyle = "#7FE0D630";
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(curScreen.x, curScreen.y);
      ctx.lineTo(nextScreen.x, nextScreen.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // next point node
      ctx.fillStyle = "#7FE0D6";
      ctx.beginPath();
      ctx.arc(nextScreen.x, nextScreen.y, 9, 0, Math.PI * 2);
      ctx.fill();
    }

    if (state === "orbiting") {
      // orbit ring
      ctx.strokeStyle = "#3A2E66";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(curScreen.x, curScreen.y, ORBIT_RADIUS, 0, Math.PI * 2);
      ctx.stroke();

      // tolerance arc (the "good window")
      var target = angleTo(current, next);
      ctx.strokeStyle = "#F4C95D";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(curScreen.x, curScreen.y, ORBIT_RADIUS, target - tolerance, target + tolerance);
      ctx.stroke();

      // current pivot
      ctx.fillStyle = "#EDE6FA";
      ctx.beginPath();
      ctx.arc(curScreen.x, curScreen.y, 6, 0, Math.PI * 2);
      ctx.fill();

      // orbiting ball
      var bx = curScreen.x + Math.cos(ballAngle) * ORBIT_RADIUS;
      var by = curScreen.y + Math.sin(ballAngle) * ORBIT_RADIUS;
      var grad = ctx.createRadialGradient(bx, by, 1, bx, by, 12);
      grad.addColorStop(0, "#FFFFFF");
      grad.addColorStop(1, "#7FE0D600");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx, by, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#EDE6FA";
      ctx.beginPath();
      ctx.arc(bx, by, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (state === "flying") {
      var t = Math.min(1, (now - flightStart) / FLIGHT_DURATION);
      var ease = 1 - Math.pow(1 - t, 3);
      var fx = flightFrom.x + (flightTo.x - flightFrom.x) * ease;
      var fy = flightFrom.y + (flightTo.y - flightFrom.y) * ease;
      var s = toScreen(fx, fy);
      ctx.fillStyle = "#EDE6FA";
      ctx.beginPath();
      ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
      ctx.fill();

      // fading old pivot
      ctx.fillStyle = "#EDE6FA55";
      ctx.beginPath();
      ctx.arc(curScreen.x, curScreen.y, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (state === "falling") {
      var fs = toScreen(fallX, fallY);
      var alpha = Math.max(0, 1 - (now - fallStart) / 650);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#E4572E";
      ctx.beginPath();
      ctx.arc(fs.x, fs.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function loop(now) {
    if (state === "orbiting" || state === "flying" || state === "falling") {
      update(now);
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  function handleInput() {
    if (state === "orbiting") attemptLaunch();
  }

  canvas.addEventListener("pointerdown", handleInput);
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); handleInput(); }
  });
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

  loadBest();
  draw(performance.now());
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
